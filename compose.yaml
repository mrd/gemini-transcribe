services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-transcribe-app
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - BODY_SIZE_LIMIT=536870912
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HOST=127.0.0.1
      - PORT=3000
      # Note: GOOGLE_API_KEY is provided by user through the web UI
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode === 200) process.exit(0); else process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gemini-transcribe-nginx
    restart: unless-stopped
    network_mode: host
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - PORT=${PORT:-8081}
    depends_on:
      app:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gemini-transcribe-cloudflared
    profiles: ["cloudflare"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --metrics localhost:20241 run --token ${CLOUDFLARE_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    depends_on:
      - nginx
